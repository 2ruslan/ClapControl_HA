name: Tests and container
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t clap-control:test .
      - run: docker run --rm --entrypoint sh clap-control:test -c 'parec --version && python -c "import clap_control.main"'
