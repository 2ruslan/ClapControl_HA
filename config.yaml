name: Clap Control
version: "1.0.0"
slug: clap_control
url: https://github.com/2ruslan/ClapControl_HA
description: Local clap detection and cyclic Home Assistant scene control
arch:
  - amd64
startup: application
boot: auto
init: false
audio: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:gesture-tap
panel_title: Clap Control
panel_admin: true
options:
  enabled: true
  clap_count: 2
  sensitivity: 50
  max_interval_ms: 800
  cooldown_seconds: 3
  scenes: []
  audio_source: ""
  log_level: INFO
  test_mode: false
  emit_event: true
schema:
  enabled: bool
  clap_count: int(1,3)
  sensitivity: int(1,100)
  max_interval_ms: int(250,2000)
  cooldown_seconds: float(0.5,60)
  scenes:
    - str
  audio_source: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  test_mode: bool
  emit_event: bool
