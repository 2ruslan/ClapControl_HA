name: Clap Control
version: "1.1.2"
slug: clap_control
url: https://github.com/2ruslan/ClapControl_HA
description: Local clap detection and cyclic Home Assistant scene control
arch:
  - amd64
startup: application
boot: auto
init: false
audio: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:gesture-tap
panel_title: Clap Control
panel_admin: true
# Detector/scene settings live in Ingress; logging is managed by Supervisor.
options:
  log_level: INFO
schema:
  log_level: list(DEBUG|INFO|WARNING|ERROR)
